[package]
name = "pi-dash"
version = "0.1.0"
edition = "2021"
description = "One-window terminal dashboard for the ClassG Raspberry Pi"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = "0.4"
hostname = "0.4"
# HTTP only, no TLS. The API this talks to is on loopback by default and the
# whole point of the pane is that it degrades rather than fails, so pulling a
# rustls/ring build onto a Pi to reach 127.0.0.1 would be a poor trade. An
# https:// base URL is reported as unsupported instead of silently failing.
ureq = { version = "2.12", default-features = false }

[profile.release]
# The Pi builds this itself; a monitoring tool is not worth a long LTO link.
lto = "thin"
strip = true

[lints.rust]
warnings = "deny"
dead_code = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
unused_variables = "deny"
unused_imports = "forbid"
unused_must_use = "forbid"
unreachable_patterns = "forbid"
unreachable_pub = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
ignored_unit_patterns = "deny"
allow_attributes = "deny"
