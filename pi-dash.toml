# pi-dash configuration.
#
# Every key is optional; anything left out keeps its built-in default, so a
# three-line file that only moves the API port is a valid config.
#
# Precedence is env > this file > defaults. CLASSG_API, CLASSG_SESSION and
# CLASSG_DASH_INTERVAL all win over what is written here, which keeps the habit
# from the Bash dashboard working:  CLASSG_API=http://pi:9000 pi-dash
#
# `pi-dash --print-config` prints every resolved value with the tier that set
# it, which is the fastest way to find the CLASSG_API still exported in a shell
# somewhere.
#
# Searched, in order: next to the binary, the working directory, then
# ~/.config/pi-dash/pi-dash.toml. Pass --config to name one explicitly.

[dash]
# Base URL of the ClassG API, without the /api/v1 suffix. This build has no
# TLS — the API is on loopback and linking a TLS stack to reach 127.0.0.1 is
# not a trade worth making on a Pi — so an https:// URL is reported as
# unsupported rather than silently failing.
api = "http://127.0.0.1:8081"

# Seconds between local samples (/proc, /sys, vcgencmd). Fractional is fine.
# Clamped to 0.25..3600: a zero interval would spin the sample loop at full
# CPU on a box whose whole problem is that it browns out under load.
interval_secs = 2.0

# Seconds between ClassG API polls. Separate from interval_secs because it is
# the only sample that leaves the process, and it runs on its own thread.
#
# Four endpoints are polled at this rate — /health, /monitoring, /tracks and
# /detections. The four that change slowly (/system, /auth/me, /captures and
# /spectrum/sweeps) are refreshed every tenth poll instead, because statting a
# filesystem and listing stored records three times a second is a cost this box
# does not need to pay to tell you the same answer.
api_interval_secs = 3.0

# Session cookie, for watching a unit that is NOT this one.
#
# Almost nobody needs this. On the box it is watching, pi-dash authenticates
# with the local-agent token the API writes into `.agent-state` at startup:
# being able to read that file is the credential, there is nothing to configure,
# and it grants viewer — enough to read the sky, not enough to restart a radio.
#
# A token on this disk describes THIS box, so pointing the dashboard at another
# unit over the network is the case a session covers. It is the value of the
# `classg_session` cookie rather than a password: pi-dash never logs in and
# holds nothing that could mint a session. Copy it from a browser that is
# already signed in.
#
# Prefer the CLASSG_SESSION environment variable, which also takes precedence
# over anything found locally. This is a live credential carrying whatever the
# person it belongs to can do, and a file sitting next to the binary is a worse
# place for one than a shell export. Empty means unset.
#
# `pi-dash --print-config` reports which credential is in play, never its value.
# session = ""

# Accent colour for borders and the title chip. Any standard terminal colour
# name; an unrecognised one falls back to cyan rather than failing to start.
theme = "cyan"

# Characters used for meters, the CPU history graph, and the pane frames.
#
#   unicode  block and braille drawing characters — the btop look (default)
#   ascii    plain ASCII, frames included
#
# Set this to "ascii" when watching on the Pi's own HDMI console: the
# framebuffer font (TERM=linux) has no block, braille or box-drawing glyphs and
# renders every one of them as a replacement character. Over SSH from anything
# modern, leave it alone. An unrecognised value falls back to unicode.
#
# Colour depth needs no setting — the green→amber→red ramp reads TERM and
# COLORTERM and drops to the sixteen ANSI colours by itself.
glyphs = "unicode"

# Rows of process table to show. Omit to fill whatever the pane has room for.
# processes = 12

[radios]
# USB vendor IDs treated as radios. Defaults cover MediaTek, Realtek (which is
# also where the RTL-SDR lands), Ralink, TP-Link, Atheros and Great Scott.
# On the Pi this was written for: 0e8d:7961 (ALFA AWUS036AXML) and 0bda:2838
# (RTL-SDR Blog V4).
usb_vendor_ids = ["0e8d", "0bda", "148f", "2357", "0cf3", "1d50"]

# Interfaces to hide. A trailing * globs a prefix; everything else is exact.
# Container and virtual-bridge plumbing is not a radio, and a Pi running the
# ClassG stack in Docker has a lot of it.
ignore_interfaces = ["lo", "docker*", "br-*", "veth*", "virbr*", "tailscale*"]
